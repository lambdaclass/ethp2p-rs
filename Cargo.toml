[workspace]
resolver = "2"
members = [
    "crates/ethp2p-protocol",
    "crates/ethp2p-broadcast",
    "crates/ethp2p-transport",
    "crates/ethp2p-sim",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lambdaclass/ethp2p-rs"
authors = ["LambdaClass <contact@lambdaclass.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
